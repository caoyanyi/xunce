name: e2e-explorer
services:
  explorer:
    image: e2e-explorer:local
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
    init: true
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-4318}:4318'
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4318
      DATA_DIR: /app/data
      CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - explorer-data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    shm_size: 1gb
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  explorer-data:
